<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scroll Snap Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    /* Horizontal Gallery */
    .horizontal-gallery {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      gap: 20px;
      padding: 20px;
      border: 3px solid #333;
      background: #fff;
      width: 320px;
      margin: 0 auto 50px auto;
    }

    .horizontal-gallery::-webkit-scrollbar {
      height: 10px;
    }

    .horizontal-gallery::-webkit-scrollbar-thumb {
      background: #999;
      border-radius: 10px;
    }

    .snap-item-horizontal {
      flex: 0 0 auto;
      scroll-snap-align: center;
      width: 300px;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ccc;
    }

    .snap-item-horizontal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Vertical Gallery */
    .vertical-gallery {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      gap: 20px;
      padding: 20px;
      border: 3px solid #333;
      background: #fff;
      height: 250px;
      width: 320px;
      margin: 0 auto 50px auto;
    }

    .vertical-gallery::-webkit-scrollbar {
      width: 10px;
    }

    .vertical-gallery::-webkit-scrollbar-thumb {
      background: #999;
      border-radius: 10px;
    }

    .snap-item-vertical {
      flex: 0 0 auto;
      scroll-snap-align: center;
      width: 300px;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ccc;
      margin: 0 auto;
    }

    .snap-item-vertical img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Both Mandatory Gallery */
    .both-mandatory-gallery {
      display: grid;
      grid-template-columns: repeat(2, 300px);
      grid-auto-rows: 200px;
      overflow: auto;
      scroll-snap-type: both mandatory;
      scroll-behavior: smooth;
      gap: 20px;
      padding: 20px;
      border: 3px solid #333;
      background: #fff;
      width: 320px; 
      height: 250px;
      margin: 0 auto 50px auto;
    }

    .both-mandatory-gallery::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    .both-mandatory-gallery::-webkit-scrollbar-thumb {
      background: #999;
      border-radius: 10px;
    }

    .snap-item-both {
      scroll-snap-align: center;
      width: 300px;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ccc;
    }

    .snap-item-both img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* X Proximity Gallery */
    .x-proximity-gallery {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scroll-behavior: smooth;
      gap: 20px;
      padding: 20px;
      border: 3px solid #333;
      background: #fff;
      width: 320px;
      margin: 0 auto;
    }

    .x-proximity-gallery::-webkit-scrollbar {
      height: 10px;
    }

    .x-proximity-gallery::-webkit-scrollbar-thumb {
      background: #999;
      border-radius: 10px;
    }

    .snap-item-x-proximity {
      flex: 0 0 auto;
      scroll-snap-align: center;
      width: 300px;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ccc;
    }

    .snap-item-x-proximity img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Y Proximity Gallery */
    .y-proximity-gallery {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-snap-type: y proximity;
      scroll-behavior: smooth;
      gap: 20px;
      padding: 20px;
      border: 3px solid #333;
      background: #fff;
      height: 250px;
      width: 320px;
      margin: 0 auto 50px auto;
    }

    .y-proximity-gallery::-webkit-scrollbar {
        width: 10px;
    }

    .y-proximity-gallery::-webkit-scrollbar-thumb {
        background: #999;
        border-radius: 10px;
    }

    .snap-item-y-proximity {
        flex: 0 0 auto;
        scroll-snap-align: center;
        width: 300px;
        height: 200px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid #ccc;
        margin: 0 auto;
    }

    .snap-item-y-proximity img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* Both Proximity Gallery */
    .both-proximity-gallery {
      display: grid;
      grid-template-columns: repeat(2, 300px);
      grid-auto-rows: 200px;
      overflow: auto;
      scroll-snap-type: both proximity;  
      scroll-behavior: smooth;
      gap: 20px;
      padding: 20px;
      border: 3px solid #333;
      background: #fff;
      width: 320px; 
      height: 250px;
      margin: 0 auto 50px auto;
    }

    .both-proximity-gallery::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    .both-proximity-gallery::-webkit-scrollbar-thumb {
      background: #999;
      border-radius: 10px;
    }

    .snap-item-both-proximity {
      scroll-snap-align: center;
      width: 300px;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ccc;
    }

    .snap-item-both-proximity img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* button */

    .next-button {
        display: inline-block;
        margin-top: 30px;
        padding: 10px 20px;
        background-color: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }

      .next-button:hover {
        background-color: #555;
      }
  </style>
</head>
